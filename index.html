        /**
         * Mélange aléatoirement un tableau (algorithme de Fisher-Yates)
         */
        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

            return [...gaps, ...translates];

                                href="https://snapchat.com/t/nOPI37hc"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="flex items-center justify-center gap-2 bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold px-4 py-3.5 rounded-xl transition shadow-sm text-center"
                            >
                                <span>👻 Groupe Snapchat</span>
                            </a>
                        </div>
                    `
                }
            ]
        };

        /**
         * Normalise une chaîne de caractères (minuscules, sans accents, espaces propres)
         */
        function normalizeText(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/['’\-.,!?/]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        /**
         * Change la sous-catégorie active dans l'onglet Anglais
         */
        function switchEnglishSubTab(subTabId) {
            activeEnglishSubTab = subTabId;
            renderFeed();
        }

        /**
         * Enregistre la saisie utilisateur sur un exercice d'anglais
         */
        function updateEnglishAnswer(exoId, value) {
            englishExerciseState.answers[exoId] = value;
        }

        /**
         * Corrige l'ensemble des exercices d'anglais
         */
        function submitEnglishExercises(event) {
            if (event) event.preventDefault();
            englishExerciseState.submitted = true;
            renderFeed();

            setTimeout(() => {
                const summaryEl = document.getElementById('englishResultsSummary');
                if (summaryEl) {
                    summaryEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 60);
        }

        /**
         * Réinitialise les exercices d'anglais avec un nouveau tirage aléatoire
         */
        function resetEnglishExercises() {
            englishExerciseState = {
                currentExercises: pickRandomEnglishExercises(),
                answers: {},
                submitted: false
            };
            renderFeed();
        }

        /**
         * Génère le contenu complet de l'onglet Anglais (sous-catégories + leçon du cours + exercices)
         */
        function renderEnglishSection() {
            const subNavHtml = `
                <div class="flex flex-wrap items-center gap-2 bg-white border border-slate-200 p-2 rounded-2xl shadow-sm">
                    ${ENGLISH_SUBTABS.map(sub => {
                        const isActive = sub.id === activeEnglishSubTab;
                        return `
                            <button
                                type="button"
                                onclick="switchEnglishSubTab('${sub.id}')"
                                class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl text-sm font-semibold transition ${
                                    isActive
                                        ? 'bg-indigo-600 text-white shadow-sm'
                                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                                }"
                            >
                                ${sub.label}
                            </button>
                        `;
                    }).join('')}
                </div>
            `;

            if (activeEnglishSubTab === 'vocabulaire') {
                return `
                    ${subNavHtml}
                    <article class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                                Anglais • Vocabulaire
                            </span>
                            <span class="text-xs font-medium text-slate-400">
                                Prochainement
                            </span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-4">
                            Vocabulaire anglais
                        </h2>
                        <div class="bg-indigo-50/70 border border-indigo-200 rounded-xl p-5 text-slate-700">
                            <p class="font-semibold text-indigo-900">
                                📝 Il sera mis à jour pour l'évaluation.
                            </p>
                        </div>
                    </article>
                `;
            }
            // Calcul du score si l'élève a validé ses réponses sur la série tirée au sort
            const activeExercises = englishExerciseState.currentExercises;
            let score = 0;
            const total = activeExercises.length;
            const evaluated = activeExercises.map(exo => {
                const rawUser = (englishExerciseState.answers[exo.id] || '').trim();
                const normUser = normalizeText(rawUser);
                const isCorrect = normUser.length > 0 && exo.accepted.some(acc => normalizeText(acc) === normUser);
                if (isCorrect) score += 1;
                return { exo, rawUser, isCorrect };
            });

            return `
                ${subNavHtml}

                <!-- FICHE DE LEÇON : L'ESSENTIEL DU COURS (PHOTO) -->
                <article class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                            Anglais • Grammaire
                        </span>
                        <span class="text-xs font-medium text-slate-400">
                            L'essentiel du cours
                        </span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-3">
                        Les trois articles en anglais : <em>a / an</em>, <em>the</em> et <em>Ø</em>
                    </h2>
                    <p class="text-slate-700 mb-5 text-sm sm:text-base font-medium">
                        Il y a trois articles en anglais : <strong><em>a / an</em></strong>, <strong><em>the</em></strong> et <strong><em>Ø</em> (article zéro)</strong>.
                    </p>

                    <div class="space-y-4">
                        <!-- 1. a / an -->
                        <div class="border border-slate-200 rounded-xl p-4 sm:p-5 bg-slate-50/70">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-700 mb-1.5">
                                1. Article indéfini : a / an
                            </h3>
                            <p class="text-sm sm:text-base text-slate-700">
                                <strong><em>a / an</em></strong> sert à désigner <strong>un élément sans le distinguer des autres</strong> (<em>a</em> devant un son consonne, <em>an</em> devant un son voyelle).
                            </p>
                        </div>

                        <!-- 2. the -->
                        <div class="border border-slate-200 rounded-xl p-4 sm:p-5 bg-slate-50/70">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-700 mb-1.5">
                                2. Article défini : the
                            </h3>
                            <p class="text-sm sm:text-base text-slate-700">
                                <strong><em>the</em></strong> désigne <strong>un élément spécifique parce qu'il est connu de tous ou parce que le contexte apporte des précisions</strong>.
                            </p>
                        </div>

                        <!-- 3. Ø -->
                        <div class="border border-slate-200 rounded-xl p-4 sm:p-5 bg-slate-50/70">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-700 mb-1.5">
                                3. Article zéro : Ø
                            </h3>
                            <p class="text-sm sm:text-base text-slate-700">
                                <strong><em>Ø</em></strong> s'utilise pour parler <strong>d'une notion en général ou d'un groupe tout entier</strong>.
                            </p>
                        </div>

                        <!-- Attention : règle sur les noms de personnes et de pays -->
                        <div class="border border-amber-200 bg-amber-50/80 rounded-xl p-4 sm:p-5 text-amber-950">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-amber-800 mb-1.5">
                                ⚠️ Attention — Noms de personnes & noms de pays
                            </h3>
                            <p class="text-sm sm:text-base leading-relaxed">
                                Les <strong>noms de personnes</strong> sont toujours précédés de <strong><em>Ø</em></strong> (ex : <em>Ø Prince Harry</em>), ainsi que les <strong>noms de pays</strong> au singulier (ex : <em>Ø England</em>), mais les <strong>noms de pays au pluriel</strong> sont précédés de <strong><em>the</em></strong> (ex : <em>the United States</em>).
                            </p>
                        </div>
                    </div>
                </article>

                <!-- EXERCICES INTERACTIFS + CORRECTION À LA FIN -->
                <article class="bg-white border-2 border-indigo-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full">
                            Entraînement aléatoire • ${total} exercices sur ${ENGLISH_ARTICLES_EXERCISES.length}
                        </span>
                        <button
                            type="button"
                            onclick="resetEnglishExercises()"
                            class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 underline underline-offset-2"
                        >
                            🔄 Changer les phrases maintenant
                        </button>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-2">
                        Exercices d'application sur la leçon
                    </h2>
                    <p class="text-slate-600 text-sm sm:text-base mb-6">
                        Complète les textes à trous avec le bon article (écris <code class="bg-slate-100 px-1.5 py-0.5 rounded font-bold text-slate-800">Ø</code> ou <code class="bg-slate-100 px-1.5 py-0.5 rounded font-bold text-slate-800">rien</code> pour l'article zéro), puis traduis les phrases simples. Les phrases changent à chaque nouvelle série !
                    </p>

                    <form onsubmit="submitEnglishExercises(event)" class="space-y-5">
                        ${evaluated.map(({ exo, rawUser, isCorrect }, index) => {
                            const isGap = exo.type === 'gap';
                            let cardBorder = 'border-slate-200 bg-slate-50/50';
                            if (englishExerciseState.submitted) {
                                cardBorder = isCorrect
                                    ? 'border-emerald-300 bg-emerald-50/40'
                                    : 'border-rose-300 bg-rose-50/40';
                            }

                            return `
                                <div class="border ${cardBorder} rounded-xl p-4 sm:p-5 transition">
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                        <span class="text-xs font-bold uppercase tracking-wider ${isGap ? 'text-sky-700 bg-sky-100/80' : 'text-amber-800 bg-amber-100/80'} px-2.5 py-0.5 rounded-md">
                                            Exercice ${index + 1} • ${isGap ? 'Texte à trous' : 'Traduction FR → EN'}
                                        </span>
                                        ${englishExerciseState.submitted ? `
                                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                                ${isCorrect ? '✓ Correct' : '✗ À revoir'}
                                            </span>
                                        ` : ''}
                                    </div>

                                    <p class="text-xs text-slate-500 mb-1.5">${exo.instruction}</p>
                                    <p class="font-bold text-slate-900 text-base sm:text-lg mb-2">${exo.prompt}</p>
                                    <p class="text-xs text-indigo-700 mb-3">💡 Indice : ${exo.hint}</p>

                                    <input
                                        type="text"
                                        value="${rawUser.replace(/"/g, '&quot;')}"
                                        oninput="updateEnglishAnswer(${exo.id}, this.value)"
                                        ${englishExerciseState.submitted ? 'disabled' : ''}
                                        placeholder="${isGap ? 'Écris l’article (ex : a, an, the, Ø...)' : 'Écris ta traduction en anglais...'}"
                                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 font-medium text-sm sm:text-base disabled:bg-slate-100 disabled:text-slate-600"
                                    />
                                </div>
                            `;
                        }).join('')}

                        ${!englishExerciseState.submitted ? `
                            <div class="pt-2">
                                <button
                                    type="submit"
                                    class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3.5 rounded-xl transition shadow-sm"
                                >
                                    <span>Vérifier mes réponses et afficher le corrigé</span>
                                    <span>→</span>
                                </button>
                            </div>
                        ` : ''}
                    </form>

                    ${englishExerciseState.submitted ? `
                        <!-- CORRIGÉ COMPLET À LA FIN DES EXERCICES -->
                        <div id="englishResultsSummary" class="mt-8 pt-6 border-t-2 border-indigo-100">
                            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-5 sm:p-6 text-center mb-6">
                                <span class="inline-block text-xs font-bold uppercase tracking-wider text-indigo-700 bg-white px-3 py-1 rounded-full mb-2">
                                    Bilan des exercices
                                </span>
                                <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
                                    Ton score : <span class="text-indigo-600">${score} / ${total}</span>
                                </h3>
                                <p class="text-sm sm:text-base text-slate-600 mt-1">
                                    Retrouve toutes les réponses attendues et les explications juste en dessous !
                                </p>
                            </div>

                            <h4 class="text-base sm:text-lg font-bold text-slate-900 mb-4">
                                📋 Corrigé détaillé de tous les exercices
                            </h4>

                            <div class="space-y-3 mb-6">
                                ${evaluated.map(({ exo, rawUser, isCorrect }, idx) => `
                                    <div class="border border-slate-200 bg-slate-50/70 rounded-xl p-4">
                                        <div class="flex items-center justify-between gap-2 mb-1">
                                            <span class="text-xs font-bold text-slate-700">Exercice ${idx + 1}</span>
                                            <span class="text-xs font-bold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                                ${isCorrect ? '✓ Bonne réponse' : `Ta réponse : ${rawUser || '(vide)'}`}
                                            </span>
                                        </div>
                                        <p class="text-sm text-slate-700 mb-1">${exo.prompt}</p>
                                        <p class="text-sm font-bold text-emerald-700 mb-1">
                                            ✅ Réponse attendue : ${exo.answer}
                                        </p>
                                        <p class="text-xs text-slate-600 leading-relaxed">
                                            ${exo.explanation}
                                        </p>
                                    </div>
                                `).join('')}
                            </div>

                            <button
                                type="button"
                                onclick="resetEnglishExercises()"
                                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-3 rounded-xl transition"
                            >
                                <span>🔄 Nouvelle série avec d'autres phrases</span>
                            </button>
                        </div>
                    ` : ''}
                </article>
            `;
        }

        /**
         * Affiche la barre d'onglets principale
         */
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            if (!container) return;
            container.innerHTML = TABS.map(tab => {
                const isActive = tab.id === activeTabId;
                return `
                    <button
                        type="button"
                        onclick="switchTab('${tab.id}')"
                        class="px-4 py-3 text-sm sm:text-base font-semibold whitespace-nowrap border-b-2 transition-colors ${
                            isActive
                                ? 'border-indigo-600 text-indigo-600'
                                : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'
                        }"
                    >
                        ${tab.label}
                    </button>
                `;
            }).join('');
        }

        /**
         * Affiche le fil vertical des leçons de l'onglet actif
         */
        function renderFeed() {
            const feed = document.getElementById('lessonsFeed');
            if (!feed) return;

            if (activeTabId === 'anglais') {
                feed.innerHTML = renderEnglishSection();
                return;
            }

            const lessons = LESSONS_BY_TAB[activeTabId] || [];

            if (lessons.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center shadow-sm">
                        <p class="text-slate-600 font-medium">Aucune leçon disponible dans cet onglet pour le moment.</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = lessons.map(lesson => `
                <article class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                            ${lesson.badge}
                        </span>
                        <span class="text-xs font-medium text-slate-400">
                            ${lesson.date}
                        </span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-4">
                        ${lesson.title}
                    </h2>
                    <div class="text-slate-700 leading-relaxed text-sm sm:text-base">
                        ${lesson.contentHtml}
                    </div>
                </article>
            `).join('');
        }

        /**
         * Change d'onglet actif
         */
        function switchTab(tabId) {
            activeTabId = tabId;
            renderTabs();
            renderFeed();
        }

        /**
         * Initialisation immédiate et au chargement du DOM
         */
        function initApp() {
            renderTabs();
            renderFeed();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
