        /**
         * État courant du quiz interactif (Mode Normal)
         */
        let quizState = {
            started: false,
            finished: false,
            questions: [],
            currentIndex: 0,
            attempts: 0,
            score: 0,
            feedback: null, // { type: 'success' | 'retry' | 'fail', message: string }
            resolved: false,
            wrongOptionIndices: [],
            selectedOptionIndex: null,
            results: []
        };

        /**
         * État courant du quiz interactif (Mode Difficile — Lorenzo & les courageux)
         */
        let hardQuizState = {
            started: false,
            finished: false,
            questions: [],
            currentIndex: 0,
            score: 0,
            results: []
        };

        /**
         * Normalise une chaîne de caractères (minuscules, sans accents, espaces propres)
         */
        function normalizeText(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/['’\-]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        /**
         * Génère 4 propositions mélangées pour les questions QCM (événement)
         */
        function buildEventOptions(correctItem, allItems) {
            const distractors = allItems
                .filter(other => other.id !== correctItem.id && other.event !== correctItem.event)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(other => other.event);

            const options = [correctItem.event, ...distractors];
            return options.sort(() => Math.random() - 0.5);
        }

        /**
         * Initialise ou relance le quiz dans l'ordre chronologique avec mode aléatoire (date ou QCM événement)
         */
        function startQuiz() {
            const generatedQuestions = HISTOIRE_REPERES.map(item => {
                const askType = Math.random() < 0.5 ? 'date' : 'event';
                return {
                    ...item,
                    askType,
                    options: askType === 'event' ? buildEventOptions(item, HISTOIRE_REPERES) : []
                };
            });

            quizState = {
                started: true,
                finished: false,
                questions: generatedQuestions,
                currentIndex: 0,
                attempts: 0,
                score: 0,
                feedback: null,
                resolved: false,
                wrongOptionIndices: [],
                selectedOptionIndex: null,
                results: []
            };

            renderFeed();
            setTimeout(() => {
                const input = document.getElementById('quizAnswerInput');
                if (input) input.focus();
            }, 50);
        }

        /**
         * Vérifie la réponse saisie pour une question de DATE
         */
        function checkAnswer(event) {
            if (event) event.preventDefault();
            if (quizState.resolved) return;

            const inputEl = document.getElementById('quizAnswerInput');
            if (!inputEl) return;

            const rawValue = inputEl.value.trim();
            if (!rawValue) return;

            const currentQ = quizState.questions[quizState.currentIndex];
            const userNorm = normalizeText(rawValue);
            const isCorrect = currentQ.acceptedDates.some(valid => normalizeText(valid) === userNorm);

            if (isCorrect) {
                quizState.score += 1;
                quizState.resolved = true;
                quizState.feedback = {
                    type: 'success',
                    message: `Exact ! La bonne réponse est bien : ${currentQ.date}.`
                };
                quizState.results.push({
                    question: currentQ,
                    correct: true,
                    userAnswer: rawValue
                });
            } else {
                quizState.attempts += 1;
                if (quizState.attempts === 1) {
                    quizState.feedback = {
                        type: 'retry',
                        message: `Ce n'est pas tout à fait ça (${currentQ.dateFormat}). Réessaie une seconde fois !`
                    };
                    inputEl.select();
                } else {
                    quizState.resolved = true;
                    quizState.feedback = {
                        type: 'fail',
                        message: `Toujours faux. La bonne réponse était : ${currentQ.date}`
                    };
                    quizState.results.push({
                        question: currentQ,
                        correct: false,
                        userAnswer: rawValue
                    });
                }
            }

            renderFeed();
        }

        /**
         * Vérifie le choix cliqué pour une question QCM (ÉVÉNEMENT)
         */
        function selectQcmOption(optionIndex) {
            if (quizState.resolved || quizState.wrongOptionIndices.includes(optionIndex)) return;

            const currentQ = quizState.questions[quizState.currentIndex];
            const chosenText = currentQ.options[optionIndex];
            const isCorrect = chosenText === currentQ.event;

            quizState.selectedOptionIndex = optionIndex;

            if (isCorrect) {
                quizState.score += 1;
                quizState.resolved = true;
                quizState.feedback = {
                    type: 'success',
                    message: `Exact ! Il s'agit bien de : ${currentQ.event}.`
                };
                quizState.results.push({
                    question: currentQ,
                    correct: true,
                    userAnswer: chosenText
                });
            } else {
                quizState.attempts += 1;
                quizState.wrongOptionIndices.push(optionIndex);
                if (quizState.attempts === 1) {
                    quizState.feedback = {
                        type: 'retry',
                        message: "Mauvaise proposition ! Il te reste un essai, choisis une autre réponse."
                    };
                } else {
                    quizState.resolved = true;
                    quizState.feedback = {
                        type: 'fail',
                        message: `Toujours faux. La bonne réponse était : ${currentQ.event}`
                    };
                    quizState.results.push({
                        question: currentQ,
                        correct: false,
                        userAnswer: chosenText
                    });
                }
            }

            renderFeed();
        }

        /**
         * Passe à la question chronologique suivante ou affiche le bilan final
         */
        function nextQuestion() {
            if (quizState.currentIndex + 1 < quizState.questions.length) {
                quizState.currentIndex += 1;
                quizState.attempts = 0;
                quizState.feedback = null;
                quizState.resolved = false;
                quizState.wrongOptionIndices = [];
                quizState.selectedOptionIndex = null;
                renderFeed();
                setTimeout(() => {
                    const input = document.getElementById('quizAnswerInput');
                    if (input) input.focus();
                }, 50);
            } else {
                quizState.finished = true;
                renderFeed();
            }
        }

        /**
         * =====================================================================
         * LOGIQUE DU QUIZ DIFFICILE (SPÉCIAL LORENZO ET LES COURAGEUX)
         * - Pas de QCM (saisie écrite pour les dates ET les événements)
         * - Aucune aide / indice de format
         * - 1 seule tentative par question
         * - Aucun retour immédiat : score et correction révélés uniquement à la fin
         * =====================================================================
         */
        function startHardQuiz() {
            const generatedQuestions = HISTOIRE_REPERES.map(item => ({
                ...item,
                askType: Math.random() < 0.5 ? 'date' : 'event'
            }));

            hardQuizState = {
                started: true,
                finished: false,
                questions: generatedQuestions,
                currentIndex: 0,
                score: 0,
                results: []
            };

            renderFeed();
            setTimeout(() => {
                const input = document.getElementById('hardQuizAnswerInput');
                if (input) input.focus();
            }, 50);
        }

        function submitHardAnswer(event) {
            if (event) event.preventDefault();

            const inputEl = document.getElementById('hardQuizAnswerInput');
            if (!inputEl) return;

            const rawValue = inputEl.value.trim();
            if (!rawValue) return;

            const currentQ = hardQuizState.questions[hardQuizState.currentIndex];
            const userNorm = normalizeText(rawValue);

            let isCorrect = false;
            if (currentQ.askType === 'date') {
                isCorrect = currentQ.acceptedDates.some(valid => normalizeText(valid) === userNorm);
            } else {
                const officialNorm = normalizeText(currentQ.event);
                isCorrect =
                    officialNorm === userNorm ||
                    currentQ.acceptedEvents.some(valid => {
                        const validNorm = normalizeText(valid);
                        return userNorm === validNorm || (userNorm.length >= 5 && validNorm.includes(userNorm)) || userNorm.includes(validNorm);
                    });
            }

            if (isCorrect) {
                hardQuizState.score += 1;
            }

            hardQuizState.results.push({
                question: currentQ,
                correct: isCorrect,
                userAnswer: rawValue
            });

            if (hardQuizState.currentIndex + 1 < hardQuizState.questions.length) {
                hardQuizState.currentIndex += 1;
                renderFeed();
                setTimeout(() => {
                    const nextInput = document.getElementById('hardQuizAnswerInput');
                    if (nextInput) nextInput.focus();
                }, 50);
            } else {
                hardQuizState.finished = true;
                renderFeed();
            }
        }

                    ${isDateQuestion ? `
                        <!-- Formulaire saisie de DATE -->
                        <form onsubmit="checkAnswer(event)" class="space-y-3">
                            <input
                                id="quizAnswerInput"
                                type="text"
                                autocomplete="off"
                                ${quizState.resolved ? 'disabled' : ''}
                                placeholder="${currentQ.datePlaceholder}"
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 font-medium disabled:bg-slate-100 disabled:text-slate-500"
                            />

                            ${!quizState.resolved ? `
                                <button
                                    type="submit"
                                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition"
                                >
                                    ${quizState.attempts === 0 ? 'Valider ma réponse' : 'Réessayer (2e essai)'}
                                </button>
                            ` : ''}
                        </form>
                    ` : `
                        <!-- QCM à 4 propositions pour l'ÉVÉNEMENT -->
                        <div class="grid grid-cols-1 gap-2.5">
                            ${currentQ.options.map((optionText, idx) => {
                                const isWrong = quizState.wrongOptionIndices.includes(idx);
                                const isRightOption = optionText === currentQ.event;
                                let btnClass = "border-slate-200 bg-slate-50/70 hover:bg-indigo-50 hover:border-indigo-300 text-slate-800";

                                if (quizState.resolved) {
                                    if (isRightOption) {
                                        btnClass = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                                    } else if (isWrong) {
                                        btnClass = "border-rose-200 bg-rose-50/60 text-rose-400 line-through";
                                    } else {
                                        btnClass = "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                                    }
                                } else if (isWrong) {
                                    btnClass = "border-rose-300 bg-rose-50 text-rose-500 line-through cursor-not-allowed";
                                }

                                return `
                                    <button
                                        type="button"
                                        onclick="selectQcmOption(${idx})"
                                        ${quizState.resolved || isWrong ? 'disabled' : ''}
                                        class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-start gap-3 ${btnClass}"
                                    >
                                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg text-xs font-bold shrink-0 ${quizState.resolved && isRightOption ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-300 text-slate-700'}">
                                            ${letters[idx]}
                                        </span>
                                        <span class="text-sm sm:text-base leading-snug">${optionText}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    `}

                    ${feedbackBanner}

                    ${quizState.resolved ? `
                        <div class="mt-4">
                            <button
                                type="button"
                                onclick="nextQuestion()"
                                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-3 rounded-xl transition"
                            >
                                <span>${quizState.currentIndex + 1 < total ? 'Question suivante →' : 'Voir mon score final'}</span>
                            </button>
                        </div>
                    ` : ''}
                </article>
            `;
        }

        /**
         * Génère le bloc HTML du Quiz Difficile (spécial Lorenzo et les courageux)
         */
        function renderHardHistoireQuizCard() {
            const total = HISTOIRE_REPERES.length;

            // Écran d'accueil du Mode Difficile
            if (!hardQuizState.started) {
                return `
                    <article class="bg-slate-900 text-slate-100 border-2 border-rose-500/40 rounded-2xl p-6 sm:p-8 shadow-md">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-rose-300 bg-rose-500/20 border border-rose-500/30 px-3 py-1 rounded-full">
                                🔥 Mode Hardcore • Spécial Lorenzo & les courageux
                            </span>
                            <span class="text-xs font-medium text-slate-400">
                                ${total} questions • Sans filet
                            </span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-extrabold text-white mb-2">
                            Quiz Difficile : L'épreuve ultime
                        </h2>
                        <p class="text-slate-300 text-sm sm:text-base mb-5 leading-relaxed">
                            Même parcours chronologique que le quiz normal, mais en conditions réelles : <strong>plus de QCM</strong> pour les événements, <strong>aucune aide sur le format</strong> des dates, <strong>une seule tentative</strong> par question et <strong>verdict uniquement à la fin</strong> !
                        </p>
                        <button
                            type="button"
                            onclick="startHardQuiz()"
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-sm"
                        >
                            <span>Relever le défi (Mode Difficile)</span>
                            <span>→</span>
                        </button>
                    </article>
                `;
            }

            // Écran de score final du Mode Difficile
            if (hardQuizState.finished) {
                const percentage = Math.round((hardQuizState.score / total) * 100);
                let appreciation = "Mode difficile validé à la sueur ! Révise bien les erreurs ci-dessous.";
                if (percentage === 100) {
                    appreciation = "LÉGENDAIRE ! 100% en mode difficile, même Lorenzo s'incline !";
                } else if (percentage >= 80) {
                    appreciation = "Impressionnant ! Tu maîtrises le chapitre sur le bout des doigts sans aucune aide.";
                } else if (percentage >= 50) {
                    appreciation = "Pas mal du tout pour du sans filet ! Regarde tes erreurs pour atteindre le sans-faute.";
                }

                const mistakes = hardQuizState.results.filter(r => !r.correct);

                return `
                    <article class="bg-slate-900 text-slate-100 border-2 border-rose-500/50 rounded-2xl p-6 sm:p-8 shadow-md">
                        <div class="text-center mb-6">
                            <span class="inline-block text-xs font-bold uppercase tracking-wider text-rose-300 bg-rose-500/20 px-3 py-1 rounded-full mb-3">
                                🔥 Verdict final — Mode Difficile
                            </span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">
                                Ton score : <span class="text-rose-400">${hardQuizState.score} / ${total}</span>
                            </h2>
                            <p class="text-slate-300 mt-2 text-sm sm:text-base">${appreciation}</p>
                        </div>

                        ${mistakes.length > 0 ? `
                            <div class="mb-6 bg-slate-800/90 border border-slate-700 rounded-xl p-4 sm:p-5">
                                <h3 class="text-sm font-bold uppercase tracking-wider text-rose-300 mb-3">
                                    Correction de tes erreurs (${mistakes.length})
                                </h3>
                                <ul class="space-y-2.5 text-sm">
                                    ${mistakes.map(m => `
                                        <li class="p-3 bg-slate-900/90 border border-slate-700 rounded-lg">
                                            <div class="font-bold text-white">${m.question.date} — ${m.question.event}</div>
                                            <div class="text-xs text-rose-400 mt-1">
                                                Ta réponse (${m.question.askType === 'date' ? 'Date' : 'Événement'}) : ${m.userAnswer}
                                            </div>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        ` : `
                            <div class="mb-6 bg-emerald-500/20 border border-emerald-500/40 text-emerald-200 rounded-xl p-4 text-center font-semibold text-sm">
                                🏆 Zéro faute en Mode Difficile ! Respect total !
                            </div>
                        `}

                        <div class="flex justify-center">
                            <button
                                type="button"
                                onclick="startHardQuiz()"
                                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 text-white font-bold px-6 py-3 rounded-xl transition"
                            >
                                <span>Retenter le Mode Difficile</span>
                            </button>
                        </div>
                    </article>
                `;
            }

            // Écran de question en cours (Mode Difficile)
            const currentQ = hardQuizState.questions[hardQuizState.currentIndex];
            const remainingCount = total - hardQuizState.currentIndex;
            const progressPercent = Math.round((hardQuizState.currentIndex / total) * 100);
            const isDateQuestion = currentQ.askType === 'date';

            return `
                <article class="bg-slate-900 text-slate-100 border-2 border-rose-500/50 rounded-2xl p-6 sm:p-8 shadow-md">
                    <!-- En-tête de progression -->
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-rose-300 bg-rose-500/20 px-3 py-1 rounded-full">
                            🔥 Difficile • Question ${hardQuizState.currentIndex + 1} / ${total}
                        </span>
                        <span class="text-xs sm:text-sm font-bold text-slate-200 bg-slate-800 px-3 py-1 rounded-full">
                            ${remainingCount} ${remainingCount > 1 ? 'questions restantes' : 'dernière question'}
                        </span>
                    </div>

                    <!-- Barre de progression -->
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-5">
                        <div class="bg-rose-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                    </div>

                    <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="inline-block text-xs font-bold uppercase tracking-wider ${isDateQuestion ? 'text-amber-300 bg-amber-500/20' : 'text-sky-300 bg-sky-500/20'} px-2.5 py-0.5 rounded-md">
                            ${isDateQuestion ? 'Écris la date' : "Écris l'événement"}
                        </span>
                        <span class="text-xs font-semibold text-rose-400">
                            1 seul essai • Score masqué
                        </span>
                    </div>

                    <!-- Énoncé sans aucune aide -->
                    <div class="mb-5">
                        ${isDateQuestion ? `
                            <h2 class="text-lg sm:text-xl font-bold text-white">
                                Quelle est la date de cet événement : <span class="text-rose-300">« ${currentQ.event} »</span> ?
                            </h2>
                        ` : `
                            <h2 class="text-lg sm:text-xl font-bold text-white">
                                Quel événement correspond à la date : <span class="text-rose-300">« ${currentQ.date} »</span> ?
                            </h2>
                        `}
                    </div>

                    <form onsubmit="submitHardAnswer(event)" class="space-y-3">
                        <input
                            id="hardQuizAnswerInput"
                            type="text"
                            autocomplete="off"
                            placeholder="${isDateQuestion ? 'Saisis la date...' : 'Saisis l’événement...'}"
                            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500 text-white placeholder-slate-400 font-medium"
                        />

                        <button
                            type="submit"
                            class="w-full sm:w-auto bg-rose-600 hover:bg-rose-500 text-white font-bold px-6 py-3 rounded-xl transition"
                        >
                            ${hardQuizState.currentIndex + 1 < total ? 'Valider et passer à la suite →' : 'Valider et découvrir mon score'}
                        </button>
                    </form>
                </article>
            `;
        }

        /**
         * Affiche la barre d'onglets
         */
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = TABS.map(tab => {
                const isActive = tab.id === activeTabId;
                return `
                    <button
                        type="button"
                        onclick="switchTab('${tab.id}')"
                        class="px-4 py-3 text-sm sm:text-base font-semibold whitespace-nowrap border-b-2 transition-colors ${
                            isActive
                                ? 'border-indigo-600 text-indigo-600'
                                : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'
                        }"
                    >
                        ${tab.label}
                    </button>
                `;
            }).join('');
        }

        /**
         * Affiche le fil vertical des leçons de l'onglet actif
         */
        function renderFeed() {
            const feed = document.getElementById('lessonsFeed');
            const lessons = LESSONS_BY_TAB[activeTabId] || [];

            if (lessons.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center shadow-sm">
                        <p class="text-slate-600 font-medium">Aucune leçon disponible dans cet onglet pour le moment.</p>
                    </div>
                `;
                return;
            }

            const quizHtml = activeTabId === 'histoire'
                ? renderHistoireQuizCard() + renderHardHistoireQuizCard()
                : '';

            const lessonsHtml = lessons.map(lesson => `
                <article class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">
                            ${lesson.badge}
                        </span>
                        <span class="text-xs font-medium text-slate-400">
                            ${lesson.date}
                        </span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 mb-4">
                        ${lesson.title}
                    </h2>
                    <div class="text-slate-700 leading-relaxed text-sm sm:text-base">
                        ${lesson.contentHtml}
                    </div>
                </article>
            `).join('');

            feed.innerHTML = quizHtml + lessonsHtml;

            // Si un quiz d'Histoire est actuellement en cours (ni arrêté, ni terminé),
            // on masque toutes les dates dans la fiche de révision en bas tout en laissant les événements visibles.
            const isAnyQuizActive =
                activeTabId === 'histoire' &&
                ((quizState.started && !quizState.finished) || (hardQuizState.started && !hardQuizState.finished));

            if (isAnyQuizActive) {
                const dateSpans = feed.querySelectorAll('ul li > span:first-child');
                dateSpans.forEach(span => {
                    span.innerHTML = '<span class="inline-block text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-200/70 px-2.5 py-0.5 rounded-md select-none">🔒 Date masquée</span>';
                });
            }
        }

        /**
         * Change d'onglet actif
         */
        function switchTab(tabId) {
            activeTabId = tabId;
            renderTabs();
            renderFeed();
        }

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderFeed();
        });
    </script>
</body>
</html>
